name: Test and build Windows browser

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Renderer, WASM and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run URL, graphics-policy and WebAssembly tests
        run: npm test
      - name: Build production renderer
        run: npm run build
      - name: Audit full locked dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Record full dependency audit
        run: node scripts/dependency-audit.cjs
      - name: Upload Linux test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Linux-checks
          path: |
            dependency-audit.json
            dependency-tree.json
          if-no-files-found: ignore
          retention-days: 30

  windows-portable:
    name: Build and smoke-test Windows x64 portable app
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Audit full locked dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Record full dependency audit
        run: node scripts/dependency-audit.cjs
      - name: Build Windows x64 portable executable
        run: npm run package:win
      - name: Validate packaged Windows executable
        id: packaged_executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe was not produced.' }
          $exeItem = Get-Item $exe
          if ($exeItem.Length -lt 30000000) { throw "Executable is unexpectedly small ($($exeItem.Length) bytes); refusing to upload a placeholder." }
          Write-Host "PASS: TriCoreBrowser.exe exists and is $($exeItem.Length) bytes."
      - name: Upload unverified packaged executable for diagnostics
        id: packaged_smoke_candidate
        if: always() && steps.packaged_executable.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Windows-x64-unverified-smoke-candidate
          path: release/TriCoreBrowser.exe
          if-no-files-found: error
          retention-days: 30
      - name: Run packaged-app smoke test
        id: packaged_smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe disappeared before smoke-test launch.' }
          $exeItem = Get-Item $exe
          $stdout = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stderr.txt'
          $smokeLog = Join-Path $env:RUNNER_TEMP 'tricore-smoke-main.log.txt'
          if (Test-Path $smokeLog) { Remove-Item $smokeLog -Force }
          $fsrSmokeOut = Join-Path $env:RUNNER_TEMP 'tricore-fsr-integration-smoke'
          if (Test-Path $fsrSmokeOut) { Remove-Item $fsrSmokeOut -Recurse -Force }
          New-Item -ItemType Directory -Path $fsrSmokeOut -Force | Out-Null
          $env:TRICORE_REQUIRE_FSR_INTEGRATION_SMOKE = 'PASS'
          $env:TRICORE_FSR_SMOKE_OUT = $fsrSmokeOut
          $env:TRICORE_SMOKE_LOG = $smokeLog
          try {
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test') -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(300000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process.WaitForExit()
            throw 'Packaged browser smoke test timed out after 300 seconds.'
          }
          $process.Refresh()
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if (Test-Path $smokeLog) { Get-Content $smokeLog }
          Add-Content -Path $smokeLog -Value "[workflow] Packaged process exit code: $($process.ExitCode)" -Encoding utf8
          if ($process.ExitCode -ne 0) { throw "Packaged browser smoke test exited with $($process.ExitCode)." }
          $smokeText = if (Test-Path $smokeLog) { Get-Content $smokeLog -Raw } else { '' }
          if (-not $smokeText.Contains('[smoke] Independent WebGPU known-answer compute probe: PASS')) { throw 'Packaged smoke log does not contain the independent WebGPU known-answer compute result.' }
          $computeProbePath = Join-Path $fsrSmokeOut 'webgpu-compute-smoke-summary.json'
          if (-not (Test-Path $computeProbePath -PathType Leaf)) { throw 'Independent WebGPU known-answer compute summary was not produced.' }
          $computeProbe = Get-Content $computeProbePath -Raw | ConvertFrom-Json
          if ($computeProbe.status -ne 'PASS' -or $computeProbe.state -ne 'output-verified' -or $computeProbe.secureContext -ne $true -or $computeProbe.apiDetected -ne $true -or $computeProbe.deviceRequested -ne $true -or $computeProbe.shaderCompilationStatus -ne 'passed' -or $computeProbe.pipelineCreationStatus -ne 'passed' -or $computeProbe.resourceInitializationStatus -ne 'passed' -or $computeProbe.dispatches -ne 1 -or $computeProbe.queueCompleted -ne $true -or $computeProbe.expectedResult -ne 42 -or $computeProbe.readbackResult -ne 42 -or $computeProbe.readbackVerified -ne $true -or $computeProbe.physicalGpuValidation -ne 'NOT RUN') { throw "Independent WebGPU compute/readback test did not validate 19 + 23 = 42: $($computeProbe | ConvertTo-Json -Depth 8 -Compress)" }
          $gpuSwitches = $computeProbe.launchDiagnostics.gpuRelatedSwitches
          if ($gpuSwitches.'enable-unsafe-webgpu' -or $gpuSwitches.'ignore-gpu-blocklist' -or $gpuSwitches.'disable-gpu-driver-bug-workarounds' -or $gpuSwitches.'disable-gpu-sandbox' -or $gpuSwitches.'disable-gpu' -or $gpuSwitches.'disable-webgpu' -or ([string]$gpuSwitches.'disable-dawn-features' -match 'adapter_blocklist')) { throw 'WebGPU smoke was launched with an unsafe WebGPU, disabled GPU/sandbox, blocklist bypass, or driver-workaround override.' }
          if (-not $smokeText.Contains('[smoke] Active-core immersive fullscreen: PASS') -or -not $smokeText.Contains('[smoke] Immersive fullscreen exit: PASS')) { throw 'Packaged smoke log does not contain successful immersive fullscreen enter/exit and layout-restoration evidence.' }
          if (-not $smokeText.Contains('[smoke] Diagnostic-only WebContentsView WebGL2 capture')) { throw 'Packaged smoke log does not contain the diagnostic-only capturePage PNG → FSR1 evidence.' }
          $summaryPath = Join-Path $fsrSmokeOut 'browser-frame-smoke-summary.json'
          if (-not (Test-Path $summaryPath -PathType Leaf)) { throw 'Browser-frame FSR smoke report was not produced.' }
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          if ($summary.status -ne 'PASS' -or $summary.source -ne 'Electron WebContents.capturePage() PNG') { throw 'Browser-frame smoke report does not validate Electron capturePage PNG input.' }
          if ($summary.softwareAdapter -ne $true -or $summary.frameCount -ne 3 -or $summary.distinctInputFrames -ne 3 -or $summary.distinctInputResolutions -ne 3) { throw 'Browser-frame smoke must report three unique changing frames at three resolutions processed on WARP software, never as physical-GPU evidence.' }
          if ($summary.frames.Count -ne 3) { throw 'Browser-frame smoke report must contain three per-frame native reports.' }
          $referencePaths = @()
          foreach ($frame in $summary.frames) {
            if ($frame.nativeReport.status -ne 'PASS' -or $frame.nativeReport.inputSource -ne 'Electron WebContents.capturePage() PNG' -or $frame.nativeReport.softwareAdapter -ne $true) { throw 'A per-frame report did not validate the screenshot-to-FSR WARP path.' }
            if ([System.IO.Path]::GetFullPath([string]$frame.nativeReport.bilinearReferencePath) -ne [System.IO.Path]::GetFullPath([string]$frame.referencePath)) { throw 'A per-frame report did not match its own bilinear-reference PNG path.' }
            $referencePaths += [System.IO.Path]::GetFullPath([string]$frame.referencePath)
            if (-not (Test-Path $frame.inputPath -PathType Leaf) -or -not (Test-Path $frame.outputPath -PathType Leaf) -or -not (Test-Path $frame.referencePath -PathType Leaf) -or -not (Test-Path $frame.reportPath -PathType Leaf)) { throw 'A browser capture, processed PNG, bilinear reference, or per-frame report is missing.' }
            foreach ($imagePath in @($frame.inputPath, $frame.outputPath, $frame.referencePath)) {
              $imageBytes = [System.IO.File]::ReadAllBytes($imagePath)
              if ($imageBytes.Length -lt 80 -or $imageBytes[0] -ne 137 -or $imageBytes[1] -ne 80 -or $imageBytes[2] -ne 78 -or $imageBytes[3] -ne 71) { throw "Expected a non-empty PNG capture: $imagePath" }
            }
          }
          if (@($referencePaths | Sort-Object -Unique).Count -ne 3) { throw 'The three frames must retain three distinct bilinear-reference PNG paths.' }
          if (-not $smokeText.Contains('[smoke] Live WebGPU game target')) { throw 'Packaged smoke log does not contain live WebGPU FSR1 visible-output evidence.' }
          $webGpuSummaryPath = Join-Path $fsrSmokeOut 'fsr1-webgpu-summary.json'
          if (-not (Test-Path $webGpuSummaryPath -PathType Leaf)) { throw 'Live WebGPU FSR1 summary was not produced.' }
          $webGpuSummary = Get-Content $webGpuSummaryPath -Raw | ConvertFrom-Json
          if ($webGpuSummary.status -ne 'PASS' -or $webGpuSummary.api -ne 'WebGPU' -or $webGpuSummary.readbackForProcessing -ne $false -or $webGpuSummary.physicalGpuValidation -ne 'NOT RUN' -or $webGpuSummary.processedFrames -lt 3) { throw 'Live WebGPU FSR1 summary does not validate three processed frames, readback-free processing, and honest physical-GPU status.' }
          if ($webGpuSummary.input.width -le 0 -or $webGpuSummary.input.height -le 0 -or $webGpuSummary.input.width -ge $webGpuSummary.output.width -or $webGpuSummary.input.height -ge $webGpuSummary.output.height) { throw 'Live WebGPU FSR1 must report a smaller game render target and larger visible output.' }
          if ($webGpuSummary.lifecycle.adapterDetected -ne $true -or $webGpuSummary.lifecycle.shaderCompilationStatus -ne 'passed' -or $webGpuSummary.lifecycle.pipelineCreationStatus -ne 'passed' -or $webGpuSummary.lifecycle.resourceInitializationStatus -ne 'passed' -or $webGpuSummary.lifecycle.easuComputePipelineInitialized -ne $true -or $webGpuSummary.lifecycle.rcasComputePipelineInitialized -ne $true -or $webGpuSummary.lifecycle.presentationPipelineInitialized -ne $true -or $webGpuSummary.lifecycle.outputSubmittedToVisibleCanvas -ne $true) { throw 'Live WebGPU FSR1 must report adapter detection, successful shaders/resources, EASU/RCAS compute and presentation pipeline initialization, and output submission.' }
          if ($webGpuSummary.dispatch.easuDispatches -lt 3 -or $webGpuSummary.dispatch.rcasDispatches -lt 3) { throw 'Live WebGPU FSR1 must report at least three dispatches for both EASU and RCAS.' }
          if ($webGpuSummary.imageValidation.status -ne 'PASS' -or $webGpuSummary.imageValidation.readbackFeedsProcessing -ne $false -or $webGpuSummary.imageValidation.motion.changed -ne $true -or $webGpuSummary.imageValidation.stageComparison.status -ne 'PASS' -or $webGpuSummary.imageValidation.visibleCanvas.status -ne 'PASS' -or $webGpuSummary.lifecycle.visibleCanvasScreenshotCompared -ne $true -or $webGpuSummary.lifecycle.visibleOutputVerified -ne $true) { throw 'Live WebGPU FSR1 numerical stage, motion, or post-processing visible-canvas screenshot comparison failed or is missing.' }
          if ($webGpuSummary.imageValidation.stageComparison.checks.dimensionsUpscaled -ne $true -or $webGpuSummary.imageValidation.stageComparison.checks.inputHasDetail -ne $true -or $webGpuSummary.imageValidation.stageComparison.checks.easuContributes -ne $true -or $webGpuSummary.imageValidation.stageComparison.checks.rcasContributes -ne $true -or $webGpuSummary.imageValidation.stageComparison.checks.outputHasDetail -ne $true) { throw 'Live WebGPU FSR1 stage comparison is missing one or more numerical contribution checks.' }
          if (-not $webGpuSummary.timingDefinition.Contains('not a GPU timestamp')) { throw 'Live WebGPU timings must be identified as queue-completion wall time, not GPU timestamps.' }
          foreach ($captureName in @('lowResolutionInput', 'easuIntermediate', 'rcasOutput')) {
            $stageCapture = $webGpuSummary.imageValidation.captures.$captureName
            if (-not $stageCapture -or -not (Test-Path $stageCapture.path -PathType Leaf)) { throw "Post-processing WebGPU stage capture is missing: $captureName" }
            $stageCaptureBytes = [System.IO.File]::ReadAllBytes($stageCapture.path)
            if ($stageCaptureBytes.Length -lt 80 -or $stageCaptureBytes[0] -ne 137 -or $stageCaptureBytes[1] -ne 80 -or $stageCaptureBytes[2] -ne 78 -or $stageCaptureBytes[3] -ne 71) { throw "Post-processing WebGPU stage capture is not a non-empty PNG: $captureName" }
            if ((Get-FileHash -Path $stageCapture.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $stageCapture.sha256.ToLowerInvariant()) { throw "Post-processing WebGPU stage capture SHA-256 does not match: $captureName" }
          }
          $visibleCapture = $webGpuSummary.visibleOutputCapture
          if (-not $visibleCapture -or -not (Test-Path $visibleCapture.path -PathType Leaf)) { throw 'Post-processing visible WebGPU output capture is missing.' }
          $visibleCaptureBytes = [System.IO.File]::ReadAllBytes($visibleCapture.path)
          if ($visibleCaptureBytes.Length -lt 80 -or $visibleCaptureBytes[0] -ne 137 -or $visibleCaptureBytes[1] -ne 80 -or $visibleCaptureBytes[2] -ne 78 -or $visibleCaptureBytes[3] -ne 71) { throw 'Post-processing visible WebGPU output capture is not a non-empty PNG.' }
          if ((Get-FileHash -Path $visibleCapture.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $visibleCapture.sha256.ToLowerInvariant()) { throw 'Post-processing visible WebGPU output capture SHA-256 does not match.' }
          $releaseEvidence = Join-Path $PWD 'release/fsr1-integration-smoke'
          if (Test-Path $releaseEvidence) { Remove-Item $releaseEvidence -Recurse -Force }
          Copy-Item $fsrSmokeOut $releaseEvidence -Recurse -Force
          Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_SMOKE_TEST=PASS' -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_FSR_INTEGRATION_SMOKE=PASS' -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TRICORE_FSR_SMOKE_OUT=$fsrSmokeOut" -Encoding utf8
          Write-Host "PASS: $($exeItem.Length) byte Windows x64 portable executable; screenshot diagnostic: 3 changing capturePage PNG frames at 3 resolutions processed by the FSR1 D3D12 helper on WARP; live integration: at least 3 readback-free WebGPU game-target frames displayed through the visible canvas; physical-GPU validation remains NOT RUN."
          } catch {
            $workflowFailure = "[workflow] Packaged smoke validation failed at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)`n$($_.ScriptStackTrace)"
            try { Add-Content -Path $smokeLog -Value $workflowFailure -Encoding utf8 } catch {}
            Write-Host $workflowFailure
            throw
          }
      - name: Surface packaged smoke diagnostics
        if: failure() && (steps.packaged_executable.outcome == 'failure' || steps.packaged_smoke.outcome == 'failure')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticFiles = @(
            'tricore-smoke-main.log.txt',
            'tricore-smoke.stdout.txt',
            'tricore-smoke.stderr.txt',
            'tricore-fsr-integration-smoke/browser-frame-smoke-summary.json',
            'tricore-fsr-integration-smoke/webgpu-compute-smoke-summary.json',
            'tricore-fsr-integration-smoke/fsr1-webgpu-summary.json',
            'tricore-fsr-integration-smoke/packaged-smoke-failure-summary.json',
            'tricore-fsr-integration-smoke/fsr1-webgpu-visible-output.png'
          )
          $diagnosticLines = [System.Collections.Generic.List[string]]::new()
          $diagnosticLines.Add('# Packaged browser smoke diagnostics')
          $diagnosticLines.Add('')
          foreach ($relativePath in $diagnosticFiles) {
            $logPath = Join-Path $env:RUNNER_TEMP $relativePath
            $diagnosticLines.Add("## $relativePath")
            $diagnosticLines.Add('')
            $diagnosticLines.Add('```text')
            if (Test-Path $logPath -PathType Leaf) {
              if ($logPath.EndsWith('.png', [System.StringComparison]::OrdinalIgnoreCase)) {
                $pngItem = Get-Item -LiteralPath $logPath
                $pngHash = (Get-FileHash -LiteralPath $logPath -Algorithm SHA256).Hash.ToLowerInvariant()
                $diagnosticLines.Add("PNG evidence: $($pngItem.Length) bytes · SHA-256 $pngHash")
              } else {
                $tail = @(Get-Content -Path $logPath -Tail 80)
                if ($tail.Count -eq 0) { $diagnosticLines.Add('[file exists but is empty]') }
                else { foreach ($line in $tail) { $diagnosticLines.Add([string]$line) } }
              }
            } else {
              $diagnosticLines.Add('[file was not produced]')
            }
            $diagnosticLines.Add('```')
            $diagnosticLines.Add('')
          }
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'tricore-smoke-diagnostics.md'
          $diagnosticContent = $diagnosticLines.ToArray()
          Set-Content -Path $diagnosticPath -Value $diagnosticContent -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $diagnosticContent -Encoding utf8
          $annotationText = $diagnosticContent -join "`n"
          if ($annotationText.Length -gt 8000) { $annotationText = $annotationText.Substring(0, 8000) + "`n[diagnostic annotation truncated]" }
          $annotationText = $annotationText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Packaged browser smoke diagnostics::$annotationText"
      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Packaged-Smoke-Diagnostics
          path: |
            ${{ runner.temp }}/tricore-smoke-main.log.txt
            ${{ runner.temp }}/tricore-smoke.stdout.txt
            ${{ runner.temp }}/tricore-smoke.stderr.txt
            ${{ runner.temp }}/tricore-smoke-diagnostics.md
            ${{ runner.temp }}/tricore-fsr-integration-smoke/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble portable distribution and reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\scripts\package-windows.ps1
          } catch {
            $packageFailure = "[package] Portable distribution assembly failed at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)`n$($_.ScriptStackTrace)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $packageFailure -Encoding utf8
            $annotationText = $packageFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Portable distribution assembly failed::$annotationText"
            throw
          }
      - name: Upload Windows portable package and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Windows-x64
          path: |
            release/TriCoreBrowser.exe
            release/TriCoreBrowser-Windows-x64-portable.zip
            release/BUILD_REPORT.txt
            release/SIZE_AUDIT.txt
            release/SHA256SUMS.txt
            release/fsr1-integration-smoke/**
            dependency-audit.json
            dependency-tree.json
          if-no-files-found: error
          retention-days: 30
