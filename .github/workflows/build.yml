name: Test and build Windows browser

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Renderer, WASM and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run URL, graphics-policy and WebAssembly tests
        run: npm test
      - name: Build production renderer
        run: npm run build
      - name: Audit full locked dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Record full dependency audit
        run: node scripts/dependency-audit.cjs
      - name: Upload Linux test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Linux-checks
          path: |
            dependency-audit.json
            dependency-tree.json
          if-no-files-found: ignore
          retention-days: 30

  windows-portable:
    name: Build and smoke-test Windows x64 portable app
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Audit full locked dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Record full dependency audit
        run: node scripts/dependency-audit.cjs
      - name: Build Windows x64 portable executable
        run: npm run package:win
      - name: Validate packaged Windows executable
        id: packaged_executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe was not produced.' }
          $exeItem = Get-Item $exe
          if ($exeItem.Length -lt 30000000) { throw "Executable is unexpectedly small ($($exeItem.Length) bytes); refusing to upload a placeholder." }
          Write-Host "PASS: TriCoreBrowser.exe exists and is $($exeItem.Length) bytes."
      - name: Run packaged-app smoke test
        id: packaged_smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe disappeared before smoke-test launch.' }
          $exeItem = Get-Item $exe
          $stdout = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stderr.txt'
          $fsrSmokeOut = Join-Path $env:RUNNER_TEMP 'tricore-fsr-browser-frame-smoke'
          if (Test-Path $fsrSmokeOut) { Remove-Item $fsrSmokeOut -Recurse -Force }
          New-Item -ItemType Directory -Path $fsrSmokeOut -Force | Out-Null
          $env:TRICORE_REQUIRE_FSR_BROWSER_SMOKE = 'PASS'
          $env:TRICORE_FSR_SMOKE_OUT = $fsrSmokeOut
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test') -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(300000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process.WaitForExit()
            throw 'Packaged browser smoke test timed out after 300 seconds.'
          }
          $process.Refresh()
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "Packaged browser smoke test exited with $($process.ExitCode)." }
          $smokeText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          if (-not $smokeText.Contains('[smoke] Real WebContentsView WebGL2 capture')) { throw 'Packaged smoke log does not contain browser-frame capture-to-FSR evidence.' }
          $summaryPath = Join-Path $fsrSmokeOut 'browser-frame-smoke-summary.json'
          if (-not (Test-Path $summaryPath -PathType Leaf)) { throw 'Browser-frame FSR smoke report was not produced.' }
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          if ($summary.status -ne 'PASS' -or $summary.source -ne 'Electron WebContents.capturePage() PNG') { throw 'Browser-frame smoke report does not validate Electron capturePage PNG input.' }
          if ($summary.softwareAdapter -ne $true -or $summary.frameCount -ne 3 -or $summary.distinctInputFrames -ne 3 -or $summary.distinctInputResolutions -ne 3) { throw 'Browser-frame smoke must report three unique changing frames at three resolutions processed on WARP software, never as physical-GPU evidence.' }
          if ($summary.frames.Count -ne 3) { throw 'Browser-frame smoke report must contain three per-frame native reports.' }
          $referencePaths = @()
          foreach ($frame in $summary.frames) {
            if ($frame.nativeReport.status -ne 'PASS' -or $frame.nativeReport.inputSource -ne 'Electron WebContents.capturePage() PNG' -or $frame.nativeReport.softwareAdapter -ne $true) { throw 'A per-frame report did not validate the screenshot-to-FSR WARP path.' }
            if ([string]$frame.nativeReport.bilinearReferencePath -ne [string]$frame.referencePath) { throw 'A per-frame report did not match its own bilinear-reference PNG path.' }
            $referencePaths += [System.IO.Path]::GetFullPath([string]$frame.referencePath)
            if (-not (Test-Path $frame.inputPath -PathType Leaf) -or -not (Test-Path $frame.outputPath -PathType Leaf) -or -not (Test-Path $frame.referencePath -PathType Leaf) -or -not (Test-Path $frame.reportPath -PathType Leaf)) { throw 'A browser capture, processed PNG, bilinear reference, or per-frame report is missing.' }
            foreach ($imagePath in @($frame.inputPath, $frame.outputPath, $frame.referencePath)) {
              $imageBytes = [System.IO.File]::ReadAllBytes($imagePath)
              if ($imageBytes.Length -lt 80 -or $imageBytes[0] -ne 137 -or $imageBytes[1] -ne 80 -or $imageBytes[2] -ne 78 -or $imageBytes[3] -ne 71) { throw "Expected a non-empty PNG capture: $imagePath" }
            }
          }
          if (@($referencePaths | Sort-Object -Unique).Count -ne 3) { throw 'The three frames must retain three distinct bilinear-reference PNG paths.' }
          $releaseEvidence = Join-Path $PWD 'release/fsr1-browser-frame-smoke'
          if (Test-Path $releaseEvidence) { Remove-Item $releaseEvidence -Recurse -Force }
          Copy-Item $fsrSmokeOut $releaseEvidence -Recurse -Force
          Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_SMOKE_TEST=PASS' -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_FSR_BROWSER_SMOKE=PASS' -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TRICORE_FSR_SMOKE_OUT=$fsrSmokeOut" -Encoding utf8
          Write-Host "PASS: $($exeItem.Length) byte Windows x64 portable executable; 3 distinct changing WebContentsView capturePage PNG frames at 3 resolutions processed by the FSR1 D3D12 helper on WARP; physical-GPU validation remains NOT RUN."
      - name: Surface packaged smoke diagnostics
        if: failure() && (steps.packaged_executable.outcome == 'failure' || steps.packaged_smoke.outcome == 'failure')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticFiles = @(
            'tricore-smoke.stdout.txt',
            'tricore-smoke.stderr.txt',
            'tricore-fsr-browser-frame-smoke/browser-frame-smoke-summary.json'
          )
          $diagnosticLines = [System.Collections.Generic.List[string]]::new()
          $diagnosticLines.Add('# Packaged browser smoke diagnostics')
          $diagnosticLines.Add('')
          foreach ($relativePath in $diagnosticFiles) {
            $logPath = Join-Path $env:RUNNER_TEMP $relativePath
            $diagnosticLines.Add("## $relativePath")
            $diagnosticLines.Add('')
            $diagnosticLines.Add('```text')
            if (Test-Path $logPath -PathType Leaf) {
              $tail = @(Get-Content -Path $logPath -Tail 80)
              if ($tail.Count -eq 0) { $diagnosticLines.Add('[file exists but is empty]') }
              else { foreach ($line in $tail) { $diagnosticLines.Add([string]$line) } }
            } else {
              $diagnosticLines.Add('[file was not produced]')
            }
            $diagnosticLines.Add('```')
            $diagnosticLines.Add('')
          }
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'tricore-smoke-diagnostics.md'
          $diagnosticContent = $diagnosticLines.ToArray()
          Set-Content -Path $diagnosticPath -Value $diagnosticContent -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $diagnosticContent -Encoding utf8
      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Packaged-Smoke-Diagnostics
          path: |
            ${{ runner.temp }}/tricore-smoke.stdout.txt
            ${{ runner.temp }}/tricore-smoke.stderr.txt
            ${{ runner.temp }}/tricore-smoke-diagnostics.md
            ${{ runner.temp }}/tricore-fsr-browser-frame-smoke/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble portable distribution and reports
        shell: pwsh
        run: '& .\scripts\package-windows.ps1'
      - name: Upload Windows portable package and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Windows-x64
          path: |
            release/TriCoreBrowser.exe
            release/TriCoreBrowser-Windows-x64-portable.zip
            release/BUILD_REPORT.txt
            release/SIZE_AUDIT.txt
            release/SHA256SUMS.txt
            release/fsr1-browser-frame-smoke/**
            dependency-audit.json
            dependency-tree.json
          if-no-files-found: error
          retention-days: 30
