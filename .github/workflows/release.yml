name: Build and publish Windows prerelease

on:
  push:
    branches:
      - arena/66abfdc9-tri-core-browser
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Prerelease tag (for example v1.0.0-alpha.2)'
        required: true
        type: string
        default: v1.0.0-alpha.2
      publish:
        description: 'Publish this tested build as a GitHub prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-release-build:
    name: Rebuild and smoke-test Windows x64
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[publish-prerelease ')) }}
    runs-on: [self-hosted, windows, x64, gpu]
    permissions:
      contents: read
    steps:
      - name: Check out selected source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Audit full locked dependency tree (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Record full dependency audit
        run: node scripts/dependency-audit.cjs
      - name: Build Windows x64 portable executable
        run: npm run package:win
      - name: Validate packaged Windows executable
        id: packaged_executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe was not produced.' }
          $exeItem = Get-Item $exe
          if ($exeItem.Length -lt 30000000) { throw "Executable is unexpectedly small ($($exeItem.Length) bytes); refusing to upload a placeholder." }
          Write-Host "PASS: TriCoreBrowser.exe exists and is $($exeItem.Length) bytes."
      - name: Run packaged-app smoke test with required physical GPU
        id: packaged_smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/TriCoreBrowser.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'TriCoreBrowser.exe disappeared before smoke-test launch.' }
          $exeItem = Get-Item $exe
          $stdout = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'tricore-smoke.stderr.txt'
          $smokeLog = Join-Path $env:RUNNER_TEMP 'tricore-smoke-main.log.txt'
          if (Test-Path $smokeLog) { Remove-Item $smokeLog -Force }
          $fsrSmokeOut = Join-Path $env:RUNNER_TEMP 'tricore-fsr-integration-smoke'
          if (Test-Path $fsrSmokeOut) { Remove-Item $fsrSmokeOut -Recurse -Force }
          New-Item -ItemType Directory -Path $fsrSmokeOut -Force | Out-Null
          $env:TRICORE_GPU_TEST_MODE = 'required'
          Remove-Item Env:TRICORE_REQUIRE_FSR_INTEGRATION_SMOKE -ErrorAction SilentlyContinue
          $env:TRICORE_FSR_SMOKE_OUT = $fsrSmokeOut
          $env:TRICORE_SMOKE_LOG = $smokeLog
          try {
            $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test') -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(300000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
              throw 'Packaged browser smoke test timed out after 300 seconds.'
            }
            $process.Refresh()
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (Test-Path $smokeLog) { Get-Content $smokeLog }
            Add-Content -Path $smokeLog -Value "[workflow] Packaged process exit code: $($process.ExitCode)" -Encoding utf8
            if ($process.ExitCode -ne 0) { throw "Required physical-GPU packaged smoke exited with $($process.ExitCode)." }
            & node .\scripts\validate-packaged-smoke.cjs --policy required --directory $fsrSmokeOut --smoke-log $smokeLog
            if ($LASTEXITCODE -ne 0) { throw 'Required physical-GPU packaged-smoke evidence validation failed.' }
            $packaged = Get-Content (Join-Path $fsrSmokeOut 'packaged-smoke-summary.json') -Raw | ConvertFrom-Json
            if ($packaged.physicalGpuValidation -ne 'PASS' -or $packaged.releaseEligible -ne $true) { throw 'Release requires physicalGpuValidation=PASS and releaseEligible=true.' }
            Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_GPU_TEST_MODE=required' -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_SMOKE_TEST=PASS' -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value 'TRICORE_FSR_INTEGRATION_SMOKE=PASS' -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "TRICORE_FSR_SMOKE_OUT=$fsrSmokeOut" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Level B required physical-GPU packaged smoke' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Packaged startup, browser/UI, JavaScript/WASM, security, WARP PNG, and report checks: PASS.' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Independent WebGPU known-answer dispatch/readback: PASS.' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Bundled FSR1 EASU+RCAS live output and visible-pixel evidence: PASS.' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Physical GPU adapter and active driver validation: PASS.' -Encoding utf8
            Write-Host "PASS: $($exeItem.Length) byte Windows x64 executable; required physical GPU and bundled FSR1 evidence validated."
          } catch {
            $workflowFailure = "[workflow] Packaged smoke validation failed at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)`n$($_.ScriptStackTrace)"
            try { Add-Content -Path $smokeLog -Value $workflowFailure -Encoding utf8 } catch {}
            Write-Host $workflowFailure
            throw
          }
      - name: Surface packaged smoke diagnostics
        if: failure() && (steps.packaged_executable.outcome == 'failure' || steps.packaged_smoke.outcome == 'failure')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticFiles = @(
            'tricore-smoke-main.log.txt',
            'tricore-smoke.stdout.txt',
            'tricore-smoke.stderr.txt',
            'tricore-fsr-integration-smoke/browser-frame-smoke-summary.json',
            'tricore-fsr-integration-smoke/webgpu-compute-smoke-summary.json',
            'tricore-fsr-integration-smoke/fsr1-webgpu-summary.json',
            'tricore-fsr-integration-smoke/packaged-smoke-summary.json',
            'tricore-fsr-integration-smoke/packaged-smoke-failure-summary.json',
            'tricore-fsr-integration-smoke/fsr1-webgpu-visible-output.png'
          )
          $diagnosticLines = [System.Collections.Generic.List[string]]::new()
          $diagnosticLines.Add('# Packaged browser smoke diagnostics')
          $diagnosticLines.Add('')
          foreach ($relativePath in $diagnosticFiles) {
            $logPath = Join-Path $env:RUNNER_TEMP $relativePath
            $diagnosticLines.Add("## $relativePath")
            $diagnosticLines.Add('')
            $diagnosticLines.Add('```text')
            if (Test-Path $logPath -PathType Leaf) {
              if ($logPath.EndsWith('.png', [System.StringComparison]::OrdinalIgnoreCase)) {
                $pngItem = Get-Item -LiteralPath $logPath
                $pngHash = (Get-FileHash -LiteralPath $logPath -Algorithm SHA256).Hash.ToLowerInvariant()
                $diagnosticLines.Add("PNG evidence: $($pngItem.Length) bytes · SHA-256 $pngHash")
              } else {
                $tail = @(Get-Content -Path $logPath -Tail 80)
                if ($tail.Count -eq 0) { $diagnosticLines.Add('[file exists but is empty]') }
                else { foreach ($line in $tail) { $diagnosticLines.Add([string]$line) } }
              }
            } else {
              $diagnosticLines.Add('[file was not produced]')
            }
            $diagnosticLines.Add('```')
            $diagnosticLines.Add('')
          }
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'tricore-smoke-diagnostics.md'
          $diagnosticContent = $diagnosticLines.ToArray()
          Set-Content -Path $diagnosticPath -Value $diagnosticContent -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $diagnosticContent -Encoding utf8
          $annotationText = $diagnosticContent -join "`n"
          if ($annotationText.Length -gt 8000) { $annotationText = $annotationText.Substring(0, 8000) + "`n[diagnostic annotation truncated]" }
          $annotationText = $annotationText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Packaged browser smoke diagnostics::$annotationText"
      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Packaged-Smoke-Diagnostics
          path: |
            ${{ runner.temp }}/tricore-smoke-main.log.txt
            ${{ runner.temp }}/tricore-smoke.stdout.txt
            ${{ runner.temp }}/tricore-smoke.stderr.txt
            ${{ runner.temp }}/tricore-smoke-diagnostics.md
            ${{ runner.temp }}/tricore-fsr-integration-smoke/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble physical-GPU validated portable distribution and reports
        if: env.TRICORE_FSR_INTEGRATION_SMOKE == 'PASS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\scripts\package-windows.ps1
          } catch {
            $packageFailure = "[package] Portable distribution assembly failed at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)`n$($_.ScriptStackTrace)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $packageFailure -Encoding utf8
            $annotationText = $packageFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Portable distribution assembly failed::$annotationText"
            throw
          }
      - name: Upload tested release package
        if: env.TRICORE_FSR_INTEGRATION_SMOKE == 'PASS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TriCoreBrowser-Windows-x64-release
          path: |
            release/TriCoreBrowser.exe
            release/TriCoreBrowser-Windows-x64-portable.zip
            release/BUILD_REPORT.txt
            release/SIZE_AUDIT.txt
            release/SHA256SUMS.txt
            release/TriCoreBrowser-Windows-x64/diagnostics/fsr1-integration-smoke/**
            dependency-audit.json
            dependency-tree.json
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish tested GitHub prerelease
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[publish-prerelease ')) }}
    needs: windows-release-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's tested Windows package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: TriCoreBrowser-Windows-x64-release
          path: .
      - name: Validate assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
            prefix='[publish-prerelease '
            if [[ "$subject" != "$prefix"* || "$subject" != *']' ]]; then
              echo 'Opt-in commit subject must be [publish-prerelease v1.0.0-alpha.2].' >&2
              exit 1
            fi
            RELEASE_TAG="${subject#"$prefix"}"
            RELEASE_TAG="${RELEASE_TAG%]}"
          else
            RELEASE_TAG="$DISPATCH_TAG"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-(alpha|beta|rc)[.][0-9]+$ ]]; then
            echo 'This build is experimental. Use a prerelease tag such as v1.0.0-alpha.2; stable releases are disabled.' >&2
            exit 1
          fi
          for asset in \
            release/TriCoreBrowser.exe \
            release/TriCoreBrowser-Windows-x64-portable.zip \
            release/BUILD_REPORT.txt \
            release/SIZE_AUDIT.txt \
            release/SHA256SUMS.txt; do
            if [[ ! -s "$asset" ]]; then echo "Required release asset is missing or empty: $asset" >&2; exit 1; fi
          done
          grep -q "$GITHUB_SHA" release/BUILD_REPORT.txt
          grep -q 'Physical-GPU validation: PASS' release/BUILD_REPORT.txt
          smoke_summary=$(unzip -p release/TriCoreBrowser-Windows-x64-portable.zip diagnostics/fsr1-integration-smoke/packaged-smoke-summary.json)
          printf '%s' "$smoke_summary" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const r=JSON.parse(s);if(r.status!=="PASS"||r.gpuTestPolicy!=="required"||r.physicalGpuValidation!=="PASS"||r.releaseEligible!==true||r.webGpuAcceptance?.status!=="PASS")process.exit(1);});'
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Tri-Core Browser experimental Windows build

          This prerelease contains the tested portable Windows x64 Electron/Chromium browser and its supporting documentation. It loads real websites and includes an executed WebAssembly diagnostic.

          **FSR1 scope:** the package includes a game-owned WebGPU vertical slice for the bundled scene: a lower-resolution browser-owned GPU target is processed by AMD FSR1 EASU + RCAS WGSL passes and displayed through the visible canvas without CPU readback in the processing path. It does not intercept other pages. A separate `capturePage()` PNG → D3D12 helper test is diagnostic-only and uses WARP software. The strict Level B gate requires and records physical-GPU adapter and active-driver validation as PASS; it is not a performance guarantee. Timings are not FPS claims.

          **DLSS is not implemented.** Ordinary web pages continue to render in standard Chromium; no arbitrary-page support or performance improvement is claimed. The package is unsigned. Review `BUILD_REPORT.txt`, `SIZE_AUDIT.txt`, `SHA256SUMS.txt`, and the included smoke captures/reports.
          EOF
          gh --version
          gh release create "$RELEASE_TAG" \
            release/TriCoreBrowser.exe \
            release/TriCoreBrowser-Windows-x64-portable.zip \
            release/BUILD_REPORT.txt \
            release/SIZE_AUDIT.txt \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tri-Core Browser $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
